        .header .logo {

        .header .logo-placeholder {

        }

        }
        .slogan {
            background: #F9A825;
            color: #1B5E20;
            font-weight: bold;
            padding: 6px 0;
            text-align: center;
            font-size: 14px;
            letter-spacing: 1px;

            background: #fff;
            border-bottom: 3px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

            padding: 14px 0;
            border: none;

            font-size: 16px;
            font-weight: 700;
            color: #777;
            cursor: pointer;

            border-bottom: 4px solid transparent;
        }
        .tabs button.active {
            color: #1B5E20;
            border-bottom-color: #1B5E20;
        }
        .tabs button:last-child.active {
            border-bottom-color: #0D47A1;
        }
        .content {
            max-width: 1100px;
            margin: 16px auto;
            padding: 0 12px 80px;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            margin-bottom: 20px;

            grid-template-columns: 1fr;
            gap: 16px;
        }
        .grup-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            border-top: 4px solid #1B5E20;
        }
        .grup-box .grup-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: #1B5E20;
        }
        .grup-box table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
            margin-bottom: 8px;
        }
        .grup-box table th {
            background: #e9ecef;
            padding: 4px 2px;
            font-size: 11px;
            text-align: center;
        }
        .grup-box table td {
            padding: 4px 2px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
        }
        .grup-box table tr:last-child td {
            border-bottom: none;
        }
        .grup-box .rank {
            font-weight: 700;
            color: #555;
            width: 22px;
        }
        .grup-box .tim {
            font-weight: 600;
            text-align: left;
        }
        .grup-box .poin {
            font-weight: 700;
            color: #1B5E20;
        }
        .pertandingan-list {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 2px dashed #dee2e6;
        }
        .pertandingan-list .sub-title {
            font-weight: 600;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        .pertandingan-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            font-size: 13px;
            background: white;
            border-radius: 4px;
            margin-bottom: 2px;
            border-left: 3px solid #F9A825;
        }
        .pertandingan-item .skor {
            font-weight: 700;
            color: #1B5E20;
        }
        .pertandingan-item .gol {
            font-size: 11px;
            color: #666;
        }
        .top-skor-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .top-skor-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;

            background: #1B5E20;

            font-size: 12px;

            margin-top: 20px;

        .kosong {

            font-size: 14px;
        }
        .kartu-table {

        .kartu-table th {
            background: #e9ecef;
            padding: 6px 4px;

        .kartu-table td {

        }
        .badge-kuning {
            background: #f9a825;
            color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
        }
        .badge-merah {
            background: #d32f2f;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
        }
        @media (min-width: 768px) {
            .grup-wrap {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 1024px) {
            .grup-wrap {

            }
        }
        .sub-info {
            font-size: 12px;
            color: #888;
            font-weight: normal;
        }
    </style>
</head>

        // ============================================================
        // DAFTAR TIM PER GRUP

        const timPerGrup = {
            u13: {
                A: ['Persimen X Diandra', 'Geiska Sport', 'Persimuja', 'Jaya Prana'],
                B: ['Akademi Nyuatan Bersatu', 'PS Bigung', 'Gelora Putra Sendawar', 'Petras'],

            u15: {

                B: ['PSG Muara Gusiq', 'Persimen X Diandra', 'Delirium Muara Tae'],

                D: ['Gelora Putra Sendawar', 'Jaya Prana', 'Akademi Nyuatan Bersatu']
            }
        };

        // ============================================================
        // FUNGSI HITUNG KLASEMEN PER GRUP
        // ============================================================

        function hitungKlasemenPerGrup(timGrup, matches) {
            const klasemen = {};

            // Inisialisasi semua tim di grup ini
            for (const tim of timGrup) {
                klasemen[tim] = { tim, m: 0, w: 0, d: 0, l: 0, gm: 0, gk: 0, p: 0 };
            }

            // Proses pertandingan
            for (const match of matches) {
                const tuan = match.tuan;
                const tamu = match.tamu;
                const skorTuan = match.skorTuan;
                const skorTamu = match.skorTamu;

                if (!klasemen[tuan] || !klasemen[tamu]) continue;

                klasemen[tuan].m += 1;
                klasemen[tamu].m += 1;
                klasemen[tuan].gm += skorTuan;
                klasemen[tuan].gk += skorTamu;
                klasemen[tamu].gm += skorTamu;
                klasemen[tamu].gk += skorTuan;

                if (skorTuan > skorTamu) {
                    klasemen[tuan].w += 1;
                    klasemen[tuan].p += 3;
                    klasemen[tamu].l += 1;
                } else if (skorTuan < skorTamu) {
                    klasemen[tamu].w += 1;
                    klasemen[tamu].p += 3;
                    klasemen[tuan].l += 1;
                } else {
                    klasemen[tuan].d += 1;
                    klasemen[tuan].p += 1;
                    klasemen[tamu].d += 1;
                    klasemen[tamu].p += 1;
                }
            }

            // Konversi ke array dan sorting
            const result = Object.values(klasemen);
            result.sort((a, b) => {
                if (b.p !== a.p) return b.p - a.p;
                const selisihA = a.gm - a.gk;
                const selisihB = b.gm - b.gk;
                if (selisihB !== selisihA) return selisihB - selisihA;
                return b.gm - a.gm;
            });

            return result;
        }

        // ============================================================
        // FUNGSI HITUNG TOP SKOR
        // ============================================================

        function hitungTopSkor(pertandinganGrup) {
            const golMap = {};

            for (const g of Object.keys(pertandinganGrup)) {
                const matches = pertandinganGrup[g] || [];
                for (const match of matches) {
                    const gol = match.gol || [];
                    for (const g of gol) {
                        const key = `${g.nama}|${g.no}|${g.tim}`;
                        if (!golMap[key]) {
                            golMap[key] = { nama: g.nama, no: g.no, tim: g.tim, gol: 0 };
                        }
                        golMap[key].gol += 1;
                    }
                }
            }

            const result = Object.values(golMap);
            result.sort((a, b) => b.gol - a.gol);
            return result;
        }

        // ============================================================
        // RENDER FUNGSI
        // ============================================================

        function renderKlasemen(containerId, kategori, pertandinganGrup) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const tims = timPerGrup[kategori];
            let html = '';

            for (const g of Object.keys(tims).sort()) {
                const timGrup = tims[g];
                const matches = pertandinganGrup[g] || [];
                const klasemen = hitungKlasemenPerGrup(timGrup, matches);

                html += `
                    <div class="grup-box">
                        <div class="grup-title">GRUP ${g}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th style="text-align:left">Tim</th>
                                    <th>M</th>
                                    <th>W</th>
                                    <th>D</th>
                                    <th>L</th>
                                    <th>GM</th>
                                    <th>GK</th>
                                    <th>P</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${klasemen.map((row, idx) => `
                                    <tr>
                                        <td class="rank">${idx + 1}</td>
                                        <td class="tim">${row.tim}</td>
                                        <td>${row.m}</td>
                                        <td>${row.w}</td>
                                        <td>${row.d}</td>
                                        <td>${row.l}</td>
                                        <td>${row.gm}</td>
                                        <td>${row.gk}</td>
                                        <td class="poin">${row.p}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        ${matches.length > 0 ? `
                        <div class="pertandingan-list">
                            <div class="sub-title">📋 Hasil Pertandingan</div>
                            ${matches.map(m => `
                                <div class="pertandingan-item">
                                    <span>
                                        <strong>${m.tuan}</strong> vs <strong>${m.tamu}</strong>
                                        ${m.gol && m.gol.length > 0 ? `
                                            <span class="gol">
                                                (${m.gol.map(g => `${g.nama} #${g.no}`).join(', ')})
                                            </span>
                                        ` : ''}
                                    </span>
                                    <span class="skor">${m.skorTuan} - ${m.skorTamu}</span>
                                </div>
                            `).join('')}
                        </div>
                        ` : `<div class="kosong" style="padding:8px 0;font-size:12px;">Belum ada pertandingan</div>`}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderTopSkor(containerId, pertandinganGrup) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const topSkor = hitungTopSkor(pertandinganGrup);

            if (topSkor.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada data top skor</div>';
                return;
            }

            let html = '';
            topSkor.forEach(item => {
                html += `
                    <div class="top-skor-item">
                        <span class="nama">${item.nama} (#${item.no}) - ${item.tim}</span>
                        <span class="gol">${item.gol} Gol</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderKartu(containerId, kartu) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!kartu || kartu.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada data kartu</div>';
                return;
            }

            let html = `
                <table class="kartu-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th style="text-align:left">Nama Pemain</th>
                            <th style="text-align:left">Tim</th>
                            <th>🟨</th>
                            <th>🟥</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            kartu.forEach(item => {
                html += `
                    <tr>
                        <td>${item.no}</td>
                        <td style="text-align:left;font-weight:600">${item.nama}</td>
                        <td style="text-align:left">${item.tim}</td>
                        <td><span class="badge-kuning">${item.kuning}</span></td>
                        <td><span class="badge-merah">${item.merah}</span></td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // RENDER ALL
        // ============================================================

        function renderAll() {
            renderKlasemen('klasemenU13', 'u13', pertandingan.u13);
            renderTopSkor('topSkorU13', pertandingan.u13);
            renderKartu('kartuU13', kartuData.u13);

            renderKlasemen('klasemenU15', 'u15', pertandingan.u15);
            renderTopSkor('topSkorU15', pertandingan.u15);
            renderKartu('kartuU15', kartuData.u15);

        // ============================================================

        // ============================================================

        const tabs = document.querySelectorAll('#tabHeader button');
        const panels = {
            tabU13: document.getElementById('tabU13'),
            tabU15: document.getElementById('tabU15')
        };

        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                Object.values(panels).forEach(p => p.classList.remove('active'));
                const target = this.getAttribute('data-tab');
                if (panels[target]) panels[target].classList.add('active');
            });
        });
