<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Piala Soeratin 2026 - Kutai Barat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(145deg, #0d1a0d, #1a3a1a);
            padding: 16px 12px 12px;
            text-align: center;
            border-bottom: 3px solid #F9A825;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(249, 168, 37, 0.05), transparent 60%);
            pointer-events: none;
        }

        .header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .header .logo-pssi {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(249, 168, 37, 0.3);
            padding: 4px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .header .logo-pssi img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(249, 168, 37, 0.15);
        }

        .header h1 span {
            color: #F9A825;
        }

        .header .sub {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
            color: #b0b0b0;
        }

        .slogan {
            background: linear-gradient(90deg, #F9A825, #f57f17);
            color: #0a0e17;
            font-weight: 800;
            padding: 5px 0;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            background: #111827;
            border-bottom: 2px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .tabs button {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            letter-spacing: 0.5px;
        }

        .tabs button:hover {
            color: #e0e0e0;
        }

        .tabs button.active {
            color: #F9A825;
            border-bottom-color: #F9A825;
        }

        /* ===== CONTENT ===== */
        .content {
            max-width: 1100px;
            margin: 12px auto;
            padding: 0 8px 60px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== CARD ===== */
        .card {
            background: linear-gradient(145deg, #141b2b, #1a2335);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 12px 10px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card h2 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #F9A825;
            border-left: 4px solid #F9A825;
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card h2 .badge {
            font-size: 10px;
            background: rgba(249, 168, 37, 0.15);
            color: #F9A825;
            padding: 1px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(249, 168, 37, 0.2);
        }

        /* ===== GRUP ===== */
        .grup-wrap {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .grup-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
            border-top: 3px solid #F9A825;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top-width: 3px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .grup-box .grup-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: #F9A825;
            letter-spacing: 1px;
        }

        .grup-box table {
            width: 100%;
            font-size: 12px;
            border-collapse: collapse;
            min-width: 380px;
        }

        .grup-box table th {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 3px;
            font-size: 9px;
            text-align: center;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .grup-box table td {
            padding: 4px 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 11px;
            white-space: nowrap;
        }

        .grup-box table tr:last-child td {
            border-bottom: none;
        }

        .grup-box table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .grup-box .rank {
            font-weight: 700;
            color: #9ca3af;
            width: 18px;
            font-size: 11px;
        }

        .grup-box .tim {
            font-weight: 600;
            text-align: left;
            color: #e0e0e0;
            font-size: 11px;
        }

        .grup-box .poin {
            font-weight: 700;
            color: #F9A825;
            font-size: 12px;
        }

        /* ===== MATCH CARD ===== */
        .match-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }

        .match-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .match-score-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 0;
            flex-wrap: nowrap;
        }

        .match-team {
            font-weight: 700;
            font-size: 12px;
            color: #e0e0e0;
            text-align: center;
            min-width: 40px;
            max-width: 80px;
            word-break: break-word;
            line-height: 1.1;
        }

        .match-score {
            font-size: 16px;
            font-weight: 900;
            color: #F9A825;
            background: rgba(249, 168, 37, 0.08);
            padding: 2px 10px;
            border-radius: 6px;
            min-width: 40px;
            text-align: center;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ===== GOALS PER TIM ===== */
        .match-goals-wrap {
            display: grid;
            grid-template-columns: 1fr 30px 1fr;
            gap: 4px 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            align-items: start;
        }

        .match-goals-team {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .match-goals-team .team-label {
            font-weight: 600;
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 2px;
        }

        .match-goals-team.left {
            align-items: flex-end;
        }

        .match-goals-team.left .team-label {
            text-align: right;
        }

        .match-goals-team.right {
            align-items: flex-start;
        }

        .match-goals-team.right .team-label {
            text-align: left;
        }

        .match-goals-team .goal-item {
            font-size: 10px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
        }

        .match-goals-team .goal-item .goal-balls {
            color: #F9A825;
            font-size: 10px;
            letter-spacing: 0px;
        }

        .match-goals-team .goal-item .goal-name {
            color: #e0e0e0;
            font-weight: 600;
            font-size: 10px;
        }

        .match-goals-team .goal-item .goal-name.og {
            color: #ef4444;
        }

        .match-goals-team .goal-item .goal-number {
            color: #6b7280;
            font-size: 9px;
        }

        .match-goals-team .goal-item .goal-og-label {
            color: #ef4444;
            font-size: 8px;
            font-weight: 700;
            background: rgba(239, 68, 68, 0.15);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .match-goals-divider {
            color: #4b5563;
            font-size: 10px;
            text-align: center;
            padding-top: 16px;
        }

        .match-cards {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px 8px;
            font-size: 10px;
            color: #9ca3af;
            grid-column: 1 / -1;
        }

        .match-cards .card-yellow {
            color: #F9A825;
        }

        .match-cards .card-red {
            color: #ef4444;
        }

        .pertandingan-list {
            margin-top: 6px;
        }

        .pertandingan-list .sub-title {
            font-weight: 600;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .kosong {
            text-align: center;
            color: #4b5563;
            padding: 16px 0;
            font-size: 12px;
        }

        /* ===== TOP SKOR ===== */
        .top-skor-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .top-skor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 12px;
            border-left: 3px solid #F9A825;
            transition: 0.3s;
            flex-wrap: wrap;
            gap: 2px;
        }

        .top-skor-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .top-skor-item .nama {
            font-weight: 600;
            color: #e0e0e0;
            font-size: 12px;
        }

        .top-skor-item .tim {
            font-size: 10px;
            color: #6b7280;
        }

        .top-skor-item .gol {
            background: linear-gradient(135deg, #F9A825, #f57f17);
            color: #0a0e17;
            padding: 1px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 800;
        }

        /* ===== KARTU TABLE ===== */
        .kartu-table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
            min-width: 280px;
        }

        .kartu-table th {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 4px;
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .kartu-table td {
            padding: 4px 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 11px;
            white-space: nowrap;
        }

        .kartu-table tr:last-child td {
            border-bottom: none;
        }

        .kartu-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge-kuning {
            background: rgba(249, 168, 37, 0.15);
            color: #F9A825;
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid rgba(249, 168, 37, 0.2);
        }

        .badge-merah {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 16px 12px;
            font-size: 11px;
            color: #4b5563;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 16px;
        }

        .footer strong {
            color: #F9A825;
        }

        /* ===== DESKTOP ===== */
        @media (min-width: 768px) {
            .grup-wrap {
                grid-template-columns: 1fr 1fr;
            }

            .match-team {
                font-size: 15px;
                min-width: 100px;
                max-width: 200px;
            }

            .match-score {
                font-size: 26px;
                min-width: 70px;
            }

            .card h2 {
                font-size: 18px;
            }

            .grup-box table {
                min-width: auto;

            }

            .grup-box .tim {
                font-size: 13px;
            }

                font-size: 12px;
            }

            .match-goals-team .goal-item .goal-name {
                font-size: 12px;
            }

            .match-goals-team .goal-item .goal-number {
                font-size: 11px;
            }

            .match-goals-team .goal-item .goal-balls {
                font-size: 12px;
            }
        }

        @media (min-width: 1024px) {
            .grup-wrap {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

                A: ['Geiska Sport', 'Neofeliz FA', 'PS Bigung', 'Menarung'],
                B: ['PSG Muara Gusiq', 'Persimen X Diandra'],
                C: ['Persimuja', 'Kerbangan SKD', 'Asira'],
                D: ['Gelora Putra Sendawar', 'Jaya Prana', 'Akademi Nyuatan Bersatu']
            }
        };

        // ============================================================
        // FUNGSI HITUNG KLASEMEN PER GRUP
        // ============================================================

        function hitungKlasemenPerGrup(timGrup, matches) {
            const klasemen = {};

            for (const tim of timGrup) {
                klasemen[tim] = { tim, m: 0, w: 0, d: 0, l: 0, gm: 0, gk: 0, p: 0 };
            }

            for (const match of matches) {
                const tuan = match.tuan;
                const tamu = match.tamu;
                const skorTuan = match.skorTuan;
                const skorTamu = match.skorTamu;

                if (!klasemen[tuan] || !klasemen[tamu]) continue;

                klasemen[tuan].m += 1;
                klasemen[tamu].m += 1;
                klasemen[tuan].gm += skorTuan;
                klasemen[tuan].gk += skorTamu;
                klasemen[tamu].gm += skorTamu;
                klasemen[tamu].gk += skorTuan;

                if (skorTuan > skorTamu) {
                    klasemen[tuan].w += 1;
                    klasemen[tuan].p += 3;
                    klasemen[tamu].l += 1;
                } else if (skorTuan < skorTamu) {
                    klasemen[tamu].w += 1;
                    klasemen[tamu].p += 3;
                    klasemen[tuan].l += 1;
                } else {
                    klasemen[tuan].d += 1;
                    klasemen[tuan].p += 1;
                    klasemen[tamu].d += 1;
                    klasemen[tamu].p += 1;
                }
            }

            const result = Object.values(klasemen);
            result.sort((a, b) => {
                if (b.p !== a.p) return b.p - a.p;
                const selisihA = a.gm - a.gk;
                const selisihB = b.gm - b.gk;
                if (selisihB !== selisihA) return selisihB - selisihA;
                return b.gm - a.gm;
            });

            return result;
        }

        // ============================================================
        // FUNGSI HITUNG TOP SKOR
        // ============================================================

        function hitungTopSkor(pertandinganGrup) {
            const golMap = {};

            for (const g of Object.keys(pertandinganGrup)) {
                const matches = pertandinganGrup[g] || [];
                for (const match of matches) {
                    const gol = match.gol || [];
                    for (const g of gol) {
                        const key = `${g.nama}|${g.no}|${g.tim}`;
                        if (!golMap[key]) {
                            golMap[key] = { nama: g.nama, no: g.no, tim: g.tim, gol: 0 };
                        }
                        golMap[key].gol += 1;
                    }
                }
            }

            const result = Object.values(golMap);
            result.sort((a, b) => b.gol - a.gol);
            return result;
        }

        // ============================================================
        // RENDER FUNGSI
        // ============================================================

        function renderKlasemen(containerId, kategori, pertandinganGrup) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const tims = timPerGrup[kategori];
            let html = '';

            for (const g of Object.keys(tims).sort()) {
                const timGrup = tims[g];
                const matches = pertandinganGrup[g] || [];
                const klasemen = hitungKlasemenPerGrup(timGrup, matches);

                html += `
                    <div class="grup-box">
                        <div class="grup-title">GRUP ${g}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th style="text-align:left">Tim</th>
                                    <th>M</th>
                                    <th>W</th>
                                    <th>D</th>
                                    <th>L</th>
                                    <th>GM</th>
                                    <th>GK</th>
                                    <th>P</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${klasemen.map((row, idx) => `
                                    <tr>
                                        <td class="rank">${idx + 1}</td>
                                        <td class="tim">${row.tim}</td>
                                        <td>${row.m}</td>
                                        <td>${row.w}</td>
                                        <td>${row.d}</td>
                                        <td>${row.l}</td>
                                        <td>${row.gm}</td>
                                        <td>${row.gk}</td>
                                        <td class="poin">${row.p}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        ${matches.length > 0 ? `
                        <div class="pertandingan-list">
                            <div class="sub-title">📋 Hasil Pertandingan</div>
                            ${matches.map(m => {
                                // Pisahkan gol berdasarkan tim
                                const golTuan = (m.gol || []).filter(g => g.tim === m.tuan);
                                const golTamu = (m.gol || []).filter(g => g.tim === m.tamu);

                                // Cari own goal buat ditampilkan
                                const golTamuOG = golTamu.filter(g => g.nama.includes('(OG)'));
                                const golTamuNormal = golTamu.filter(g => !g.nama.includes('(OG)'));

                                const kartuTim = kartuData[kategori] || [];
                                const kartuTuan = kartuTim.filter(k => k.tim === m.tuan);
                                const kartuTamu = kartuTim.filter(k => k.tim === m.tamu);

                                let kartuHtml = '';
                                if (kartuTuan.length > 0 || kartuTamu.length > 0) {
                                    kartuHtml = '<div class="match-cards">';
                                    kartuTuan.forEach(k => {
                                        if (k.kuning > 0) kartuHtml += `<span class="card-yellow">🟨 ${k.nama} (#${k.no})</span>`;
                                        if (k.merah > 0) kartuHtml += `<span class="card-red">🟥 ${k.nama} (#${k.no})</span>`;
                                    });
                                    kartuTamu.forEach(k => {
                                        if (k.kuning > 0) kartuHtml += `<span class="card-yellow">🟨 ${k.nama} (#${k.no})</span>`;
                                        if (k.merah > 0) kartuHtml += `<span class="card-red">🟥 ${k.nama} (#${k.no})</span>`;
                                    });
                                    kartuHtml += '</div>';
                                }

                                // Fungsi render gol per tim dengan icon bola
                                function renderGolPerTim(golArray, isOG = false) {
                                    if (!golArray || golArray.length === 0) return '<span style="color:#4b5563;font-size:9px;">-</span>';
                                    const grouped = {};
                                    golArray.forEach(g => {
                                        const key = `${g.nama}|${g.no}`;
                                        if (!grouped[key]) {
                                            grouped[key] = { nama: g.nama, no: g.no, count: 0, isOG: g.nama.includes('(OG)') };
                                        }
                                        grouped[key].count += 1;
                                    });
                                    return Object.values(grouped).map(g => {
                                        const isOG = g.nama.includes('(OG)');
                                        const namaClean = g.nama.replace(' (OG)', '');
                                        const balls = '⚽'.repeat(g.count);
                                        return `
                                            <span class="goal-item">
                                                <span class="goal-balls">${balls}</span>
                                                <span class="goal-name ${isOG ? 'og' : ''}">${namaClean}</span>
                                                <span class="goal-number">#${g.no}</span>
                                                ${isOG ? `<span class="goal-og-label">OG</span>` : ''}
                                            </span>
                                        `;
                                    }).join('');
                                }

                                // Cari tahu OG asal dari tim mana
                                let ogInfo = '';
                                if (golTamuOG.length > 0) {
                                    // OG ada di tim lawan, cari asal timnya dari nama tim pemain (di data kita asal timnya Jaya Prana)
                                    // Tapi kita kasih label asal dari tuan rumah
                                    ogInfo = `<span style="color:#ef4444;font-size:8px;opacity:0.7;">(OG - ${m.tuan})</span>`;
                                }

                                return `
                                    <div class="match-card">
                                        <div class="match-score-wrap">
                                            <div class="match-team">${m.tuan}</div>
                                            <div class="match-score">${m.skorTuan} - ${m.skorTamu}</div>
                                            <div class="match-team">${m.tamu}</div>
                                        </div>

                                        <div class="match-goals-wrap">
                                            <div class="match-goals-team left">
                                                <div class="team-label">${m.tuan}</div>
                                                ${renderGolPerTim(golTuan)}
                                            </div>
                                            <div class="match-goals-divider">⚡</div>
                                            <div class="match-goals-team right">
                                                <div class="team-label">${m.tamu}</div>
                                                ${renderGolPerTim(golTamuNormal)}
                                                ${golTamuOG.map(g => `
                                                    <span class="goal-item">
                                                        <span class="goal-balls">⚽</span>
                                                        <span class="goal-name og">${g.nama.replace(' (OG)', '')}</span>
                                                        <span class="goal-number">#${g.no}</span>
                                                        <span class="goal-og-label">OG - ${m.tuan}</span>
                                                    </span>
                                                `).join('')}
                                                ${golTamuOG.length === 0 && golTamuNormal.length === 0 ? '<span style="color:#4b5563;font-size:9px;">-</span>' : ''}
                                            </div>
                                            ${kartuHtml}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        ` : `<div class="kosong" style="padding:8px 0;font-size:11px;">Belum ada pertandingan</div>`}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderTopSkor(containerId, pertandinganGrup) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const topSkor = hitungTopSkor(pertandinganGrup);

            if (topSkor.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada data top skor</div>';
                return;
            }

            let html = '';
            topSkor.forEach((item, idx) => {
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                const isOG = item.nama.includes('(OG)');
                const namaClean = item.nama.replace(' (OG)', '');
                html += `
                    <div class="top-skor-item">
                        <span>
                            <span style="color:#6b7280;margin-right:6px;">${medal}</span>
                            <span class="nama" style="${isOG ? 'color:#ef4444;' : ''}">${namaClean}</span>
                            <span class="tim">(#${item.no}) - ${item.tim}</span>
                            ${isOG ? `<span style="color:#ef4444;font-size:9px;font-weight:700;background:rgba(239,68,68,0.15);padding:1px 5px;border-radius:3px;">OG</span>` : ''}
                        </span>
                        <span class="gol">${item.gol} Gol</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderKartu(containerId, kartu) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!kartu || kartu.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada data kartu</div>';
                return;
            }

            let html = `
                <table class="kartu-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th style="text-align:left">Nama Pemain</th>
                            <th style="text-align:left">Tim</th>
                            <th>🟨</th>
                            <th>🟥</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            kartu.forEach(item => {
                html += `
                    <tr>
                        <td>${item.no}</td>
                        <td style="text-align:left;font-weight:600;color:#e0e0e0;font-size:11px;">${item.nama}</td>
                        <td style="text-align:left;color:#9ca3af;font-size:11px;">${item.tim}</td>
                        <td><span class="badge-kuning">${item.kuning}</span></td>
                        <td><span class="badge-merah">${item.merah}</span></td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // RENDER ALL
        // ============================================================

        function renderAll() {
            renderKlasemen('klasemenU13', 'u13', pertandingan.u13);
            renderTopSkor('topSkorU13', pertandingan.u13);
            renderKartu('kartuU13', kartuData.u13);

            renderKlasemen('klasemenU15', 'u15', pertandingan.u15);
            renderTopSkor('topSkorU15', pertandingan.u15);
            renderKartu('kartuU15', kartuData.u15);
        }

        // ============================================================
        // INIT
        // ============================================================

        renderAll();

        // ============================================================
        // TAB SWITCH
        // ============================================================

        const tabs = document.querySelectorAll('#tabHeader button');
        const panels = {
            tabU13: document.getElementById('tabU13'),
            tabU15: document.getElementById('tabU15')
        };

        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                Object.values(panels).forEach(p => p.classList.remove('active'));
                const target = this.getAttribute('data-tab');
                if (panels[target]) panels[target].classList.add('active');
            });
        });

        console.log('🏆 Piala Soeratin 2026 - Kutai Barat');
        console.log('📊 Data pertandingan sudah dimasukkan!');
        console.log('📋 Klasemen dan Top Skor otomatis terhitung!');
        console.log('⚽ Gol diurutkan per tim dengan icon bola!');
        console.log('🟨🟥 Kartu sudah terpasang!');
        console.log('📱 Responsive Mobile siap!');
        console.log('✅ OG di bawah Jaya Prana dengan label (OG - Gelora)');
    </script>

</body>
